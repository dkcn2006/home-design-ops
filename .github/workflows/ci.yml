name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.18.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

      - name: Lint
        run: npm run lint

      - name: Build shared
        run: npm run build --workspace @home-design-ops/shared

      - name: Test
        run: npm run test

      - name: Build API
        run: npm run build --workspace @home-design-ops/api

      - name: Build web
        run: npm run build --workspace @home-design-ops/web

      - name: Verify Docker build (API)
        run: docker build -f apps/api/Dockerfile -t hdo-api:test .

      - name: Verify Docker build (Web)
        run: docker build -f apps/web/Dockerfile -t hdo-web:test .
